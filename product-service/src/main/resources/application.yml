# ============================================
# 공통 설정
# ============================================
server:
  port: 8082

spring:
  application:
    name: product-service

  jackson:
    time-zone: Asia/Seoul

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver

  # [M1] page/size 가 사용자 입력이라 size=2000 같은 요청이 그대로 DB 까지 갔다(기본 상한 2000).
  # 목록 화면은 12~20개를 쓰므로 상한을 100으로 낮춘다. 넘는 값은 100으로 잘린다.
  data:
    web:
      pageable:
        max-page-size: 100

  jpa:
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

app:
  sql-metrics:
    enabled: true

# JWT 설정
jwt:
  secret: ${JWT_SECRET_KEY}
  access-token-exp-seconds: 1800
  refresh-token-exp-seconds: 1209600
  issuer: "thock"

# Actuator & Prometheus
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

# SpringDoc
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: false

product:
  inbox:
    enabled: true
  kafka:
    consumer-group: product-service
  outbox:
    enabled: true
    poller:
      interval-ms: 3000
